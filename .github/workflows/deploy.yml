name: Deploy site

on:
  push:
    branches: [main]
  # Called by poll.yml. A push made with GITHUB_TOKEN does not trigger workflows,
  # so the poller has to invoke this directly rather than rely on its own commit.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Explicit: when called from poll.yml the run's SHA predates the
          # poller's commit, so the default checkout would build stale data.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Dependency install scripts would otherwise execute in a job holding a
      # token that can push to main. Platform binaries come from optional
      # dependencies, not postinstall, so nothing here needs them.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
